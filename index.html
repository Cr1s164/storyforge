<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryForge - 原创小说创作与阅读平台</title>
    <meta name="description" content="StoryForge：原创小说系列管理平台，数字工匠文化系列小说集合">
    
    <!-- 样式 -->
    <link rel="stylesheet" href="css/series.css">
    
    <!-- 图标 -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    
    <!-- 预加载关键资源 -->
    <link rel="preload" href="js/series-manager.js" as="script">
    <link rel="preload" href="series/series-data.json" as="fetch" crossorigin>
</head>
<body>
    <div class="series-container">
        <!-- 头部 -->
        <header class="series-header">
            <div class="logo">StoryForge</div>
            <div class="tagline">原创小说系列管理平台 · 数字工匠文化宇宙</div>
            
            <!-- 统计数据 -->
            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <span class="stat-value" id="statSeries">0</span>
                    <span class="stat-label">系列作品</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statBooks">0</span>
                    <span class="stat-label">小说作品</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statWords">0</span>
                    <span class="stat-label">总字数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statChapters">0</span>
                    <span class="stat-label">章节数量</span>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main>
            <!-- 系列网格 -->
            <section id="seriesSection">
                <h2 class="section-title">系列作品</h2>
                <div class="series-grid" id="seriesGrid">
                    <!-- 系列卡片将通过JavaScript动态生成 -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载系列数据...</p>
                    </div>
                </div>
            </section>

            <!-- 时间线 -->
            <section class="timeline-section">
                <h2 class="section-title">创作时间线</h2>
                <div class="timeline" id="timeline">
                    <!-- 时间线事件将通过JavaScript动态生成 -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载时间线...</p>
                    </div>
                </div>
            </section>

            <!-- 推荐 -->
            <section class="recommendations">
                <h2 class="section-title">阅读推荐</h2>
                <div class="recommendation-filters" id="recommendationFilters">
                    <button class="filter-button active" data-filter="all">全部系列</button>
                    <button class="filter-button" data-filter="ongoing">进行中</button>
                    <button class="filter-button" data-filter="open-source">开源主题</button>
                    <button class="filter-button" data-filter="beginner">新手友好</button>
                </div>
                <div class="series-grid" id="recommendationGrid">
                    <!-- 推荐系列将通过JavaScript动态生成 -->
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在生成推荐...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="series-footer">
            <div class="footer-links">
                <a href="author.html" class="footer-link">作者中心</a>
                <a href="recommend.html" class="footer-link">智能推荐</a>
                <a href="reader.html" class="footer-link">开始阅读</a>
                <a href="https://cr1s164.github.io/toolkit-lab" class="footer-link" target="_blank">工具网站</a>
                <a href="https://cr1s164.github.io/gamelab" class="footer-link" target="_blank">游戏网站</a>
            </div>
            <div class="copyright">
                <p>© 2026 StoryForge - 原创小说创作与阅读平台 · 数字工匠文化系列</p>
                <p>所有内容均为原创，遵循知识共享署名-非商业性使用-相同方式共享 4.0 国际许可协议</p>
            </div>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/series-manager.js"></script>
    <script>
        // 应用主逻辑
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📚 StoryForge系列页面初始化...');
            
            // 等待系列管理器初始化
            await waitForSeriesManager();
            
            // 初始化页面
            initializePage();
            
            // 设置事件监听
            setupEventListeners();
        });
        
        /**
         * 等待系列管理器就绪
         */
        function waitForSeriesManager() {
            return new Promise((resolve) => {
                if (window.StoryForgeSeriesManager && window.StoryForgeSeriesManager.seriesData) {
                    resolve();
                } else {
                    window.StoryForgeSeriesManager.on('seriesDataLoaded', resolve);
                    window.StoryForgeSeriesManager.on('seriesDataError', (error) => {
                        console.error('系列数据加载失败:', error);
                        showErrorState();
                        resolve(); // 仍然解析，显示错误状态
                    });
                }
            });
        }
        
        /**
         * 初始化页面
         */
        function initializePage() {
            const manager = window.StoryForgeSeriesManager;
            const seriesData = manager.seriesData;
            
            if (!seriesData) {
                showErrorState();
                return;
            }
            
            // 更新统计数据
            updateStatistics(seriesData.statistics);
            
            // 渲染系列网格
            renderSeriesGrid(seriesData.series);
            
            // 渲染时间线
            renderTimeline(manager.getTimelineEvents());
            
            // 渲染推荐
            renderRecommendations(seriesData.series);
        }
        
        /**
         * 更新统计数据
         */
        function updateStatistics(stats) {
            document.getElementById('statSeries').textContent = stats.totalSeries || 0;
            document.getElementById('statBooks').textContent = stats.totalBooks || 0;
            document.getElementById('statWords').textContent = stats.totalWords ? 
                (stats.totalWords >= 10000 ? `${(stats.totalWords/10000).toFixed(1)}万` : stats.totalWords) : 0;
            document.getElementById('statChapters').textContent = stats.totalChapters || 0;
        }
        
        /**
         * 渲染系列网格
         */
        function renderSeriesGrid(seriesList) {
            const grid = document.getElementById('seriesGrid');
            
            if (!seriesList || seriesList.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📚</div>
                        <h3 class="empty-title">暂无系列作品</h3>
                        <p class="empty-description">作者正在创作中，敬请期待...</p>
                    </div>
                `;
                return;
            }
            
            // 清空加载状态
            grid.innerHTML = '';
            
            // 渲染每个系列卡片
            seriesList.forEach(series => {
                const card = createSeriesCard(series);
                grid.appendChild(card);
            });
        }
        
        /**
         * 创建系列卡片
         */
        function createSeriesCard(series) {
            const card = document.createElement('div');
            card.className = 'series-card';
            
            // 计算阅读进度
            const totalBooks = series.books.length;
            const completedBooks = series.books.filter(book => book.status === 'completed').length;
            const completionPercentage = totalBooks > 0 ? Math.round((completedBooks / totalBooks) * 100) : 0;
            
            card.innerHTML = `
                <div class="series-header-small">
                    <div class="series-icon">${series.icon || '📚'}</div>
                    <div>
                        <h3 class="series-title">${series.title}</h3>
                        <span class="series-status ${series.status}">${getStatusText(series.status)}</span>
                    </div>
                </div>
                <p class="series-description">${series.description}</p>
                
                <!-- 进度条 -->
                <div class="progress-section" style="margin: 16px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span style="font-size: 0.875rem; color: var(--text-secondary);">系列进度</span>
                        <span style="font-size: 0.875rem; font-weight: 600; color: var(--primary-color);">
                            ${completionPercentage}%
                        </span>
                    </div>
                    <div style="height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                        <div style="width: ${completionPercentage}%; height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); border-radius: 4px;"></div>
                    </div>
                </div>
                
                <!-- 书籍列表 -->
                <div class="books-list">
                    ${series.books.map((book, index) => createBookItem(book, index + 1)).join('')}
                </div>
            `;
            
            return card;
        }
        
        /**
         * 创建书籍项
         */
        function createBookItem(book, number) {
            const statusIcon = book.status === 'completed' ? '✅' : 
                             book.status === 'in-progress' ? '📝' : '🕐';
            const statusText = getBookStatusText(book.status);
            const wordsText = book.words >= 10000 ? `${(book.words/10000).toFixed(1)}万字` : `${book.words}字`;
            
            return `
                <div class="book-item" data-book-id="${book.id}" data-series-id="${book.seriesId}">
                    <div class="book-number">${number}</div>
                    <div class="book-info">
                        <div class="book-title">${book.title} ${book.subtitle ? `- ${book.subtitle}` : ''}</div>
                        <div class="book-subtitle">${book.shortDescription || ''}</div>
                        <div class="book-stats">
                            <span class="book-stat">${statusIcon} ${statusText}</span>
                            ${book.words ? `<span class="book-stat">📖 ${wordsText}</span>` : ''}
                            ${book.chapters ? `<span class="book-stat">📑 ${book.chapters}章</span>` : ''}
                        </div>
                    </div>
                    <div class="book-action">
                        ${book.status === 'completed' ? 
                            `<button class="read-button" onclick="startReading('${book.seriesId}', '${book.id}')">开始阅读</button>` :
                            `<button class="read-button" style="background: var(--text-tertiary);" disabled>即将推出</button>`
                        }
                    </div>
                </div>
            `;
        }
        
        /**
         * 渲染时间线
         */
        function renderTimeline(events) {
            const timeline = document.getElementById('timeline');
            
            if (!events || events.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📅</div>
                        <h3 class="empty-title">暂无时间线事件</h3>
                        <p class="empty-description">创作记录将在作者更新时显示</p>
                    </div>
                `;
                return;
            }
            
            // 清空加载状态
            timeline.innerHTML = '';
            
            // 渲染时间线事件（最多显示10个）
            const recentEvents = events.slice(0, 10);
            recentEvents.forEach(event => {
                const eventElement = createTimelineEvent(event);
                timeline.appendChild(eventElement);
            });
        }
        
        /**
         * 创建时间线事件
         */
        function createTimelineEvent(event) {
            const div = document.createElement('div');
            div.className = 'timeline-event';
            
            // 格式化日期
            const date = new Date(event.date);
            const formattedDate = date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            div.innerHTML = `
                <div class="event-date">${formattedDate}</div>
                <div class="event-title">${event.event}</div>
                <div class="event-description">${event.description}</div>
                ${event.icon ? `<div class="event-icon">${event.icon}</div>` : ''}
                ${event.seriesTitle ? `<div style="margin-top: 8px; font-size: 0.875rem; color: var(--text-tertiary);">来自: ${event.seriesTitle}</div>` : ''}
            `;
            
            return div;
        }
        
        /**
         * 渲染推荐
         */
        function renderRecommendations(seriesList) {
            const grid = document.getElementById('recommendationGrid');
            
            // 默认显示进行中的系列
            const ongoingSeries = seriesList.filter(series => series.status === 'ongoing');
            
            if (ongoingSeries.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <h3 class="empty-title">暂无推荐</h3>
                        <p class="empty-description">更多系列作品创作中...</p>
                    </div>
                `;
                return;
            }
            
            // 清空加载状态
            grid.innerHTML = '';
            
            // 渲染推荐系列（最多4个）
            ongoingSeries.slice(0, 4).forEach(series => {
                const card = createSeriesCard(series);
                grid.appendChild(card);
            });
        }
        
        /**
         * 设置事件监听
         */
        function setupEventListeners() {
            // 推荐筛选器
            const filterButtons = document.querySelectorAll('.filter-button');
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // 移除其他按钮的active状态
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    // 添加当前按钮的active状态
                    button.classList.add('active');
                    
                    // 应用筛选
                    const filter = button.dataset.filter;
                    applyRecommendationFilter(filter);
                });
            });
            
            // 系列数据更新监听
            window.StoryForgeSeriesManager.on('seriesDataLoaded', (data) => {
                console.log('系列数据已更新，重新渲染页面');
                initializePage();
            });
        }
        
        /**
         * 应用推荐筛选
         */
        function applyRecommendationFilter(filter) {
            const manager = window.StoryForgeSeriesManager;
            let filteredSeries = [];
            
            switch(filter) {
                case 'all':
                    filteredSeries = manager.getAllSeries();
                    break;
                case 'ongoing':
                    filteredSeries = manager.getAllSeries().filter(series => series.status === 'ongoing');
                    break;
                case 'open-source':
                    filteredSeries = manager.getRecommendedSeries({ theme: '开源' });
                    break;
                case 'beginner':
                    filteredSeries = manager.getRecommendedSeries({ difficulty: '初级' });
                    break;
                default:
                    filteredSeries = manager.getAllSeries();
            }
            
            renderRecommendations(filteredSeries);
        }
        
        /**
         * 显示错误状态
         */
        function showErrorState() {
            const grid = document.getElementById('seriesGrid');
            const timeline = document.getElementById('timeline');
            const recommendationGrid = document.getElementById('recommendationGrid');
            
            const errorHTML = `
                <div class="error-state">
                    <div class="error-icon">❌</div>
                    <h3 class="error-title">数据加载失败</h3>
                    <p class="error-message">无法加载系列数据，请检查网络连接或稍后重试。</p>
                    <button class="read-button" onclick="location.reload()" style="background: var(--accent-color);">重新加载</button>
                </div>
            `;
            
            if (grid) grid.innerHTML = errorHTML;
            if (timeline) timeline.innerHTML = errorHTML;
            if (recommendationGrid) recommendationGrid.innerHTML = errorHTML;
        }
        
        /**
         * 开始阅读
         */
        window.startReading = function(seriesId, bookId) {
            const manager = window.StoryForgeSeriesManager;
            const book = manager.getBookById(seriesId, bookId);
            
            if (book && book.readingPath) {
                // 保存阅读位置
                manager.setCurrentReading(seriesId, bookId);
                
                // 跳转到阅读页面
                window.location.href = book.readingPath;
            } else {
                alert('无法找到阅读路径，请稍后重试。');
            }
        };
        
        /**
         * 获取状态文本
         */
        function getStatusText(status) {
            const statusMap = {
                'ongoing': '进行中',
                'completed': '已完成',
                'planned': '计划中',
                'concept': '概念阶段'
            };
            return statusMap[status] || status;
        }
        
        /**
         * 获取书籍状态文本
         */
        function getBookStatusText(status) {
            const statusMap = {
                'completed': '已完本',
                'in-progress': '连载中',
                'planned': '计划中',
                'draft': '草稿中'
            };
            return statusMap[status] || status;
        }
    </script>
</body>
</html>
